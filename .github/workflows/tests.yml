name: Testes

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes unitários, de integração e de contrato com cobertura
        run: npm run test:coverage
        env:
          JWT_SECRET: segredo-de-ci-nao-usar-em-producao

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: backend/coverage/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Um único Node 22 para o job inteiro — em CI não há a divergência de
      # versão que existe localmente (better-sqlite3 do backend recompila
      # fresco aqui, então dispensa os wrappers de nvm usados em dev).
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Instalar dependências (backend)
        working-directory: backend
        run: npm ci

      - name: Instalar dependências (frontend)
        working-directory: frontend
        run: npm ci

      - name: Instalar dependências (e2e)
        working-directory: e2e
        run: npm ci

      - name: Instalar browser do Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Rodar testes E2E
        working-directory: e2e
        run: npm test

      - name: Publicar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: e2e/playwright-report/
